run: 
  epochs: 5
  device: "cpu"
  optimizer: "adam"  
  learning_rate: 1.e-2
  criterion: "CrossEntropyLoss" 
model: 
  type: "resnet18"
  model_path: ""
  inner_size: 1280
dataset: 
  type: "mnist"
  samples_per_class: 2100
  classes: 10
  batch_size: 32
  shuffle: True
  outlier_number: 2
  outlier_range: 1
  outlier_distance: 0
  context_len: 100
detection: 
  keep_epochs: [2,3,4,5,6,7,8]
  use_pca: True
  window_size: 2
  techniques: ["maha"]
  metrics: ["Loss_Context.TRAINING", "Step_time_Context.TRAINING"] #, "Optim_step_time", "Backward_time", "Gpu_energy_nvidia", "Gpu_power_nvidia"]
identification: 
  window_size: 2
  use_pca: True
  keep_epochs: [2,3,4,5,6,7,8]
  techniques: ["subsetting"]
  metrics: ["Loss_Context.TRAINING", "Step_time_Context.TRAINING"] #, "Optim_step_time", "Backward_time", "Gpu_energy_nvidia", "Gpu_power_nvidia"]